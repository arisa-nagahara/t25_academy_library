<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>アカウント作成 | MT書籍管理</title>
        <link rel="stylesheet" href="/mt_library/css/common.css" />
        <link rel="stylesheet" href="/mt_library/css/register.css" />
    </head>
    <body>
        <div class="contents">
            <div th:replace="~{common :: main_sidebar}"></div>
            <div class="main_contents">
                <div th:replace="~{common :: header}"></div>
                <div class="inner_contens">
                    <div class="page_title">書籍登録</div>
                    
                    <form id="register_form" th:action="@{/register}" method="post">   
                        <table>
                            <caption></caption>
                            <tbody>
                                <tr>
                                    <th scope="col">社員番号:</th>
                                    <td>
                                        <input type="text" name="employeeId" th:field="*{employeeId}" />
                                        <div class="error_msg" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="col">氏名:</th>
                                    <td>
                                        <input type="text" name="name" th:field="*{name}"/>
                                        <div class="error_msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="col">メールアドレス:</th>
                                    <td>
                                        <input type="text" id="email" name="email" th:field="*{email}" autocomplete="new-email" >
                                        <div class="error_msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="col">パスワード: </th>
                                    <td>
                                        <input type="password" name="password" th:field="*{password}" autocomplete="new-password" />
                                        <div class="error_msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="btn_block">
                            <a th:href="@{/login}">戻る</a>
                            <input type="submit" value="アカウント作成">
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{common :: footer}"></div>
    </body>
</html>
